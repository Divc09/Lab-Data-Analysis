# Builds the Windows zip, the macOS .dmg and the macOS launcher zip.
# - Run it by hand (Actions tab -> Build apps -> Run workflow): files appear as downloadable "artifacts" on the run.
# - Push a tag like v2.1 (matching APP_VERSION in smartfitter/core.py): the files are also attached to that GitHub release.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.14"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build SmartFitter.exe
        shell: pwsh
        run: |
          python -m venv .venv
          ./tools/build_portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/SmartFitter-portable-*.zip

  mac:
    runs-on: macos-15   # Apple Silicon (M1 and newer)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build dependencies (without the legacy Qt GUI)
        run: |
          grep -vE '^(PySide6|QtAwesome)' requirements.txt > requirements-mac.txt
          python -m pip install -r requirements-mac.txt pyinstaller==6.22.3
      - name: Build SmartFitter.app
        run: python -m PyInstaller --noconfirm --clean --workpath build/pyinstaller --distpath dist tools/smartfitter.spec
      - name: Smoke-test the app (server starts and serves the page)
        run: |
          dist/SmartFitter.app/Contents/MacOS/SmartFitter --serve --port 8765 &
          pid=$!
          for i in $(seq 60); do curl -fs -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8765/api/ping && break; sleep 1; done
          echo
          curl -fs -o /dev/null -w 'index %{http_code}\n' http://127.0.0.1:8765/
          curl -fs -o /dev/null -w 'plotly %{http_code}\n' http://127.0.0.1:8765/vendor/plotly.min.js
          kill $pid
      - name: Make .dmg and launcher zip
        run: |
          VERSION=$(python -c "from smartfitter import core; print(core.APP_VERSION)")
          mkdir -p dist/dmg
          cp -R dist/SmartFitter.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname SmartFitter -srcfolder dist/dmg -ov -format UDZO "dist/SmartFitter-$VERSION-mac-apple-silicon.dmg"
          chmod +x mac/SmartFitter.command
          (cd mac && zip -X ../dist/SmartFitter-mac-launcher.zip SmartFitter.command)
      - name: Test the launcher (installs this commit with uv, checks imports)
        env:
          SMARTFITTER_REF: ${{ github.sha }}
          SMARTFITTER_INSTALL_ONLY: "1"
        run: bash mac/SmartFitter.command
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/SmartFitter-mac-launcher.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Attach files to the release
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "SmartFitter ${TAG#v}" --notes "See the README for install steps."
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
